  - track: observer-eastmesh
    version: "2026.8.2"
    tag: "observer-eastmesh-v2026.8.2"
    date: "2026-08-15"
    previous_version: "2026.8.1"
    summary: "Adds a Wi-Fi gateway connectivity watchdog so observers recover from APs that stay associated after losing their uplink, and updates to upstream MeshCore v1.17.1."
    changes:
      - type: added
        area: wifi
        text: "Added a gateway connectivity watchdog: while connected, the node ARP-probes its gateway every 30 seconds, and if the gateway stays silent for 3 minutes it forces a full disconnect and rescan so the node can roam to a healthy AP, backing off up to 48 minutes between attempts while the outage persists."
      - type: added
        area: cli
        text: "Added `wifi reconnect` to drop the current association and rejoin from a full channel scan, for nodes that report connected but are unreachable over the network."
      - type: changed
        area: cli
        text: "Extended `get wifi.status` with gateway health (`gw:ok|lost`) and the watchdog reconnect count (`wd:<n>`), which the web panel now also shows."
      - type: changed
        area: upstream
        text: "Merged upstream MeshCore v1.17.1 including improved reply routing (direct requests reply over known return paths, and replies fall back to the default scope when the request scope is unknown), LR2021 radio improvements, and board/platform fixes."
      - type: fixed
        area: radio
        text: "Kept the user-configured RX boosted gain setting after an automatic gain control reset instead of reverting to the compiled-in default (SX126x radios)."
      - type: fixed
        area: board
        text: "Adopted upstream's SH1106 display address fallback (0x3C/0x3D) so board revisions with the other SA0 strap setting still get a working display, while keeping the EastMesh T-Beam S3 Supreme bring-up order and headless fallback."
    breaking_changes: []

  - track: observer-eastmesh
    version: "2026.8.3"
    tag: "observer-eastmesh-v2026.8.3"
    date: "2026-08-23"
    previous_version: "2026.8.2"
    summary: "Fixes the web panel going unreachable after long uptimes due to internal heap fragmentation, adds web panel self-healing and heap-health CLI counters, fixes the stats page Channel/Gateway cells, and keeps the T-Beam 1W external PA ramp time from being reset by TX power changes."
    changes:
      - type: fixed
        area: web
        text: "Fixed the web panel becoming unreachable after days of uptime while LoRa and MQTT kept working: browser page-load bursts were evicting live HTTPS sessions and forcing repeated TLS handshakes, fragmenting internal RAM until no handshake could be allocated. One-shot responses (pages, favicon, login, redirect, 401s) now release their socket immediately, while the authenticated API connection keeps keep-alive."
      - type: added
        area: web
        text: "Added web panel self-healing: the HTTPS server now refuses to start without enough internal heap headroom (retrying every 15 seconds), and restarts itself when idle if the largest free block shrinks below what a TLS handshake needs."
      - type: changed
        area: cli
        text: "Extended `get web.status` with `heals:<n>` and `deferred:<n>`, and `get mqtt.status` with `leaked:<n>` (MQTT clients abandoned after a heap-integrity failure), so heap-related failures are visible over LoRa."
      - type: fixed
        area: web
        text: "Fixed the Channel and Gateway cells on the web panel stats page always showing `--`; the stats summary now carries the Wi-Fi channel, gateway health, and watchdog reconnect count."
      - type: fixed
        area: radio
        text: "Fixed the LilyGo T-Beam 1W external PA ramp time being silently reset from 800 µs back to RadioLib's 200 µs default whenever TX power was applied (at boot and via `set tx`); every power change now re-applies the 800 µs ramp the external PA requires."
      - type: added
        area: tools
        text: "Added `eastmesh-tools/web-heap-check.sh` to read heap and service health over the HTTPS API and optionally stress the web panel with browser-style bursts."
    breaking_changes: []

