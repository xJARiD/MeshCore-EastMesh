; Xiao ESP32-S3 + NiceRF LoRa2021F33-2G4 (Semtech LR2021 dual-band).
; Pin map and RF switch table from dkmr27/MeshCore variants/xiao_s3_LoRa2021F33-2G4.

[Xiao_S3_LoRa2021F33-2G4]
extends = esp32_base
board = seeed_xiao_esp32s3
board_check = true
board_build.mcu = esp32s3
build_flags = ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/xiao_s3_LoRa2021F33-2G4
  -UENV_INCLUDE_GPS
  -D SEEED_XIAO_S3
  -D PIN_VBAT_READ=1 ; D0
  -D P_LORA_DIO_1=2 ; D1 this is IRQ and is DIO9 on LR2021
  -D P_LORA_NSS=5 ; D4
  -D P_LORA_RESET=3 ; D2
  -D P_LORA_BUSY=4 ; D3
  -D P_LORA_SCLK=7 ; D8
  -D P_LORA_MISO=8 ; D9
  -D P_LORA_MOSI=9 ; D10
  -D PIN_USER_BTN=-1 ; NC
  -D PIN_STATUS_LED=21 ; Orange user led, LOW=On
  -D PIN_BOARD_SDA=D6 ; D6=43
  -D PIN_BOARD_SCL=D7 ; D7=44
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LORA_TX_POWER=22
  -D LR2021_IRQ_DIO=9
  -D LR2021_TCXO_VOLTAGE=3.3
  -D RF_SWITCH_TABLE
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/xiao_s3_LoRa2021F33-2G4>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Xiao_S3_LoRa2021F33-2G4_repeater]
extends = Xiao_S3_LoRa2021F33-2G4
build_src_filter = ${Xiao_S3_LoRa2021F33-2G4.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Xiao_S3_LoRa2021F33-2G4.build_flags}
  -D ADVERT_NAME='"Xiao S3 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Xiao_S3_LoRa2021F33-2G4.lib_deps}
  ${esp32_ota.lib_deps}

[env:Xiao_S3_LoRa2021F33-2G4_repeater_bridge_espnow]
extends = Xiao_S3_LoRa2021F33-2G4
build_src_filter = ${Xiao_S3_LoRa2021F33-2G4.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Xiao_S3_LoRa2021F33-2G4.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Xiao_S3_LoRa2021F33-2G4.lib_deps}
  ${esp32_ota.lib_deps}

